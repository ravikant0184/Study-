<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Channel Focus</title>
<style>
  :root{
    --bg:#182722; --surface:#1f342c; --surface-2:#243c33; --line:#31504363;
    --ink:#eef2ea; --ink-dim:#a9bcb2; --chalk-yellow:#e8c468; --chalk-green:#7fd1ae; --chalk-red:#e0836f;
    --radius:8px; --radius-sm:5px; --serif:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --shadow:0 2px 10px rgba(0,0,0,.18);
  }
  [data-theme="paper"]{
    --bg:#f4efe2; --surface:#fffdf6; --surface-2:#ece4d1; --line:#d8cdb1; --ink:#2a271f; --ink-dim:#6d6653;
    --chalk-yellow:#b8860b; --chalk-green:#3f7a55; --chalk-red:#b3402b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;box-shadow:var(--shadow);position:relative;z-index:3;}
  .brand{font-family:var(--serif);font-size:1.3rem;white-space:nowrap;letter-spacing:.01em;}
  .brand em{font-style:normal;color:var(--chalk-green);}
  .top-actions{display:flex;gap:8px;margin-left:auto;}
  .icon-btn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:var(--radius);padding:7px 10px;font-size:.85rem;}
  .icon-btn:hover{border-color:var(--chalk-green);}

  /* Channel picker screen */
  .picker{max-width:640px;margin:8vh auto 0;padding:0 16px;}
  .picker h1{font-family:var(--serif);font-size:1.7rem;text-align:center;margin-bottom:6px;}
  .picker p{color:var(--ink-dim);text-align:center;font-size:.9rem;margin-bottom:26px;}
  .search-box{position:relative;}
  .search-box input{
    width:100%;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:1rem;
  }
  .search-box input:focus{outline:2px solid var(--chalk-green);outline-offset:1px;}
  .channel-results{margin-top:10px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .channel-result{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface);}
  .channel-result:last-child{border-bottom:none;}
  .channel-result:hover{background:var(--surface-2);}
  .channel-result img{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:var(--surface-2);}
  .channel-result .ct{flex:1;min-width:0;}
  .channel-result .ct .t{font-size:.92rem;font-weight:600;}
  .channel-result .ct .d{font-size:.76rem;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .channel-result button{background:var(--chalk-green);color:#0c1a15;border:none;padding:7px 14px;border-radius:var(--radius);font-size:.8rem;font-weight:600;flex-shrink:0;}

  .recent-row{margin-top:26px;}
  .recent-row .label{font-size:.75rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
  .recent-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .recent-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 12px 6px 6px;font-size:.82rem;}
  .recent-chip img{width:24px;height:24px;border-radius:50%;}
  .recent-chip:hover{border-color:var(--chalk-green);}

  /* App layout (after channel selected) */
  .app{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 57px);}
  @media (max-width:860px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:fixed;inset:57px 0 0 0;z-index:5;transform:translateX(0);transition:transform .25s;}
    .sidebar.hidden-mobile{transform:translateX(-100%);}
  }
  .sidebar{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px 30px;}
  .channel-head{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;background:var(--surface-2);}
  .channel-head img{width:42px;height:42px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px var(--surface-2),0 0 0 3px var(--chalk-green);}
  .channel-head .ct{flex:1;min-width:0;}
  .channel-head .eyebrow{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-dim);}
  .channel-head .n{font-size:.86rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .channel-head button{background:var(--surface);border:1px solid var(--line);color:var(--ink-dim);border-radius:var(--radius-sm);padding:5px 9px;font-size:.7rem;flex-shrink:0;}
  .channel-head button:hover{border-color:var(--chalk-green);color:var(--chalk-green);}

  #searchBox2{width:100%;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:.85rem;margin-bottom:10px;}
  .tabbar{display:flex;gap:4px;margin-bottom:12px;background:var(--surface-2);border-radius:var(--radius);padding:3px;}
  .tabbar button{flex:1;background:none;border:none;color:var(--ink-dim);padding:7px 4px;font-size:.72rem;border-radius:2px;}
  .tabbar button.active{background:var(--bg);color:var(--chalk-green);font-weight:600;}
  .overall-progress{padding:10px 8px;margin-bottom:12px;border:1px solid var(--line);border-radius:var(--radius);}
  .overall-progress .label{font-size:.72rem;color:var(--ink-dim);display:flex;justify-content:space-between;margin-bottom:6px;}
  .bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;}
  .bar>div{height:100%;background:var(--chalk-green);}

  .video-item{display:flex;align-items:center;gap:9px;padding:7px;border-radius:var(--radius-sm);cursor:pointer;color:var(--ink-dim);margin-bottom:3px;border:1px solid transparent;}
  .video-item:hover{background:var(--surface-2);color:var(--ink);}
  .video-item.playing{color:var(--chalk-green);background:var(--surface-2);border-color:var(--chalk-green);}
  .video-item .thumb{position:relative;width:76px;height:43px;flex-shrink:0;border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-2);}
  .video-item .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .video-item .thumb .dur{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.75);color:#fff;font-size:.6rem;padding:1px 4px;border-radius:2px;line-height:1.3;}
  .video-item .body{flex:1;min-width:0;}
  .video-item .ttl{font-size:.79rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .video-item .meta-row{display:flex;align-items:center;gap:6px;margin-top:3px;}
  .video-item .status{font-size:.75rem;flex-shrink:0;}
  .video-item .status.done{color:var(--chalk-green);}
  .video-item .status.progress{color:var(--chalk-yellow);}
  .video-item .bm{margin-left:auto;opacity:.4;flex-shrink:0;align-self:flex-start;}
  .video-item .bm.on{opacity:1;color:var(--chalk-red);}
  .empty-note{font-size:.8rem;color:var(--ink-dim);padding:10px 8px;line-height:1.5;}

  .main{padding:22px;}
  .mobile-back{display:none;}
  @media (max-width:860px){.mobile-back{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:var(--radius);font-size:.85rem;margin-bottom:14px;}}
  .player-shell{max-width:980px;margin:0 auto;}
  .player-frame-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);}
  #ytFrame{width:100%;height:100%;border:0;}
  .video-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-top:16px;}
  .video-meta h1{font-family:var(--serif);font-size:1.2rem;font-weight:600;margin:0;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:5px 10px;border-radius:20px;border:1px solid var(--line);white-space:nowrap;}
  .controls-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .ctl{background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:8px 13px;border-radius:var(--radius);font-size:.8rem;}
  .ctl:hover{border-color:var(--chalk-green);}
  .ctl.on{border-color:var(--chalk-green);color:var(--chalk-green);}
  .speed-group{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .speed-group button{background:var(--surface);border:none;color:var(--ink-dim);padding:8px 10px;font-size:.78rem;border-right:1px solid var(--line);}
  .speed-group button:last-child{border-right:none;}
  .speed-group button.on{background:var(--chalk-green);color:#0c1a15;font-weight:600;}
  .home-hero{max-width:560px;margin:6vh auto 0;text-align:center;padding:0 12px;}
  .home-hero img{width:72px;height:72px;border-radius:50%;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--chalk-green);margin-bottom:16px;}
  .home-hero h1{font-family:var(--serif);font-size:1.6rem;margin-bottom:10px;}
  .home-hero p{color:var(--ink-dim);font-size:.9rem;line-height:1.6;}
  kbd{background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-size:.75rem;}
  .kb-hint{margin-top:28px;font-size:.75rem;color:var(--ink-dim);display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .note{font-size:.72rem;color:var(--ink-dim);text-align:center;margin-top:30px;line-height:1.6;}
</style>
</head>
<body data-theme="chalk">

<header>
  <div class="brand">CHANNEL <em>FOCUS</em></div>
  <div class="top-actions">
    <button class="icon-btn" id="themeToggle">🌓 Theme</button>
    <button class="icon-btn" id="sidebarToggle" style="display:none">☰ Videos</button>
  </div>
</header>

<div id="pickerScreen" class="picker">
  <h1>Watch one channel. Nothing else.</h1>
  <p>Type any YouTube channel's name — you'll only ever see videos from that one channel. No Shorts, no Home feed, no recommendations, no rabbit holes.</p>
  <div class="search-box">
    <input id="channelSearchInput" placeholder="Search a YouTube channel…" autocomplete="off">
  </div>
  <div id="channelResults" class="channel-results" style="display:none"></div>
  <div id="recentRow" class="recent-row" style="display:none">
    <div class="label">Recently used</div>
    <div id="recentChips" class="recent-chips"></div>
  </div>
</div>

<div id="appScreen" class="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="channel-head">
      <img id="channelAvatar" src="" alt="">
      <div class="n" id="channelName"></div>
      <button id="changeChannelBtn">Switch</button>
    </div>
    <input id="searchBox2" placeholder="Search videos in this channel…" autocomplete="off">
    <div class="tabbar">
      <button class="tab-btn active" data-tab="all">All</button>
      <button class="tab-btn" data-tab="continue">Continue</button>
      <button class="tab-btn" data-tab="bookmarks">Marked</button>
    </div>
    <div class="overall-progress">
      <div class="label"><span>Progress</span><span id="overallPct">0%</span></div>
      <div class="bar"><div id="overallBar" style="width:0%"></div></div>
    </div>
    <div id="tab-all"></div>
    <div id="tab-continue" style="display:none"></div>
    <div id="tab-bookmarks" style="display:none"></div>
  </aside>
  <main class="main">
    <button class="mobile-back" id="mobileBack">← Back to Videos</button>
    <div id="mainContent"></div>
  </main>
</div>

<script>
const LS_KEY = "channelFocus_v1";
function loadState(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function saveState(s){ localStorage.setItem(LS_KEY, JSON.stringify(s)); }
let state = Object.assign({ theme:"chalk", recentChannels:[], perChannel:{} }, loadState());

function channelState(channelId){
  if(!state.perChannel[channelId]) state.perChannel[channelId] = { progress:{}, bookmarks:[], recent:[] };
  return state.perChannel[channelId];
}

let currentChannel = null; // {channelId, channelTitle, channelThumbnail}
let videos = [];
let currentVideoId = null;
let player = null;

/* ---------- Channel search (search bar #1) ---------- */
const channelSearchInput = document.getElementById("channelSearchInput");
let searchDebounce;
channelSearchInput.addEventListener("input", (e) => {
  clearTimeout(searchDebounce);
  const q = e.target.value.trim();
  if(!q){ document.getElementById("channelResults").style.display = "none"; return; }
  searchDebounce = setTimeout(() => doChannelSearch(q), 350);
});

async function doChannelSearch(q){
  const box = document.getElementById("channelResults");
  box.style.display = "block";
  box.innerHTML = `<div class="empty-note">Searching…</div>`;
  try{
    const r = await fetch(`/api/search-channels?q=${encodeURIComponent(q)}`);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    if(!data.channels.length){ box.innerHTML = `<div class="empty-note">No channels found.</div>`; return; }
    box.innerHTML = data.channels.map(c => `
      <div class="channel-result" data-select="${c.channelId}" data-title="${escapeAttr(c.title)}" data-thumb="${escapeAttr(c.thumbnail)}">
        <img src="${c.thumbnail}" alt="">
        <div class="ct"><div class="t">${c.title}</div><div class="d">${c.description||''}</div></div>
        <button>Select</button>
      </div>`).join("");
  }catch(e){
    box.innerHTML = `<div class="empty-note">Search failed: ${e.message}</div>`;
  }
}
function escapeAttr(s){ return (s||"").replace(/"/g,'&quot;'); }

document.getElementById("channelResults").addEventListener("click", (e) => {
  const el = e.target.closest("[data-select]");
  if(!el) return;
  selectChannel(el.dataset.select, el.dataset.title, el.dataset.thumb);
});

/* ---------- Recent channels ---------- */
function renderRecentChips(){
  const row = document.getElementById("recentRow");
  const box = document.getElementById("recentChips");
  if(!state.recentChannels.length){ row.style.display = "none"; return; }
  row.style.display = "block";
  box.innerHTML = state.recentChannels.map(c => `
    <div class="recent-chip" data-select="${c.channelId}" data-title="${escapeAttr(c.title)}" data-thumb="${escapeAttr(c.thumbnail)}">
      <img src="${c.thumbnail}" alt=""><span>${c.title}</span>
    </div>`).join("");
}
document.getElementById("recentChips").addEventListener("click", (e) => {
  const el = e.target.closest("[data-select]");
  if(!el) return;
  selectChannel(el.dataset.select, el.dataset.title, el.dataset.thumb);
});

/* ---------- Selecting a channel & loading its videos ---------- */
async function selectChannel(channelId, title, thumbnail){
  currentChannel = { channelId, channelTitle: title, channelThumbnail: thumbnail };
  state.recentChannels = [currentChannel, ...state.recentChannels.filter(c=>c.channelId!==channelId)].slice(0,6);
  saveState(state);

  document.getElementById("pickerScreen").style.display = "none";
  document.getElementById("appScreen").style.display = "grid";
  document.getElementById("channelAvatar").src = thumbnail;
  document.getElementById("channelName").textContent = title;

  const cacheKey = "channelFocus_videos_" + channelId;
  try{
    const cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
    if(cached && Date.now() - cached.at < 6*60*60*1000){ videos = cached.videos; renderAll(); return; }
  }catch(e){}

  videos = [];
  renderAll();
  document.getElementById("tab-all").innerHTML = `<div class="empty-note">Loading videos…</div>`;
  try{
    const r = await fetch(`/api/channel-videos?channelId=${encodeURIComponent(channelId)}`);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    videos = data.videos;
    localStorage.setItem(cacheKey, JSON.stringify({ videos, at: Date.now() }));
  }catch(e){
    document.getElementById("tab-all").innerHTML = `<div class="empty-note">Couldn't load videos (${e.message}).</div>`;
    return;
  }
  renderAll();
}

document.getElementById("changeChannelBtn").addEventListener("click", () => {
  currentChannel = null; videos = []; currentVideoId = null;
  if(player){ player.stopVideo && player.stopVideo(); }
  document.getElementById("appScreen").style.display = "none";
  document.getElementById("pickerScreen").style.display = "block";
  renderRecentChips();
});

/* ---------- Rendering ---------- */
function cs(){ return channelState(currentChannel.channelId); }
function statusIcon(id){
  const st = cs().progress[id];
  if(st==="completed") return '<span class="status done">✓</span>';
  if(st==="in-progress") return '<span class="status progress">◐</span>';
  return '<span class="status">○</span>';
}
function bmIcon(id){
  const on = cs().bookmarks.includes(id);
  return `<span class="bm ${on?'on':''}" data-bm="${id}">${on?'★':'☆'}</span>`;
}
function findVideo(id){ return videos.find(v=>v.id===id); }

function formatDuration(sec){
  if(!sec) return "";
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
  const mm = h ? String(m).padStart(2,'0') : m;
  return (h ? h+":" : "") + mm + ":" + String(s).padStart(2,'0');
}
function renderVideoList(targetId, list){
  const box = document.getElementById(targetId);
  if(!list.length){ box.innerHTML = `<div class="empty-note">Nothing here yet.</div>`; return; }
  box.innerHTML = list.map(v => `
    <div class="video-item ${v.id===currentVideoId?'playing':''}" data-play="${v.id}">
      <div class="thumb">
        <img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" loading="lazy" alt=""
             onerror="this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'">
        ${v.durationSeconds ? `<span class="dur">${formatDuration(v.durationSeconds)}</span>` : ''}
      </div>
      <div class="body">
        <div class="ttl">${v.title}</div>
        <div class="meta-row">${statusIcon(v.id)}${bmIcon(v.id)}</div>
      </div>
    </div>`).join("");
}
function renderAll(){
  if(!currentChannel) return;
  const q = (document.getElementById("searchBox2").value||"").trim().toLowerCase();
  const filtered = q ? videos.filter(v=>v.title.toLowerCase().includes(q)) : videos;
  renderVideoList("tab-all", filtered);
  renderVideoList("tab-continue", cs().recent.map(id=>findVideo(id)).filter(Boolean));
  renderVideoList("tab-bookmarks", cs().bookmarks.map(id=>findVideo(id)).filter(Boolean));
  const done = videos.filter(v=>cs().progress[v.id]==="completed").length;
  const pct = videos.length ? Math.round(done/videos.length*100) : 0;
  document.getElementById("overallPct").textContent = pct+"%";
  document.getElementById("overallBar").style.width = pct+"%";
  renderMain();
}
document.getElementById("searchBox2").addEventListener("input", renderAll);

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    ["all","continue","bookmarks"].forEach(t=>{
      document.getElementById("tab-"+t).style.display = (t===btn.dataset.tab) ? "block":"none";
    });
  });
});

function renderMain(){
  const box = document.getElementById("mainContent");
  if(!currentVideoId){
    box.innerHTML = `
      <div class="home-hero">
        <img src="${currentChannel.channelThumbnail}" alt="">
        <h1>${currentChannel.channelTitle}</h1>
        <p>Pick a video on the left. Nothing plays here that isn't from this channel — no Home feed, no Shorts, no recommendations.</p>
        <div class="kb-hint">
          <span><kbd>/</kbd> search</span><span><kbd>space</kbd> play/pause</span>
          <span><kbd>f</kbd> fullscreen</span><span><kbd>↑</kbd>/<kbd>↓</kbd> next/prev</span>
        </div>
        <div class="note">Note: YouTube's embedded player may still show its own pre-roll/mid-roll ads on some videos — that's controlled by YouTube/the creator's monetization, not something an embed can switch off. Everything in this app's own UI (feed, Shorts, recommendations) stays blocked regardless.</div>
      </div>`;
    return;
  }
  const v = findVideo(currentVideoId);
  const st = cs().progress[currentVideoId] || "not-started";
  box.innerHTML = `
    <div class="player-shell">
      <div class="player-frame-wrap" id="playerWrap"><div id="ytFrame"></div></div>
      <div class="video-meta">
        <h1>${v.title}</h1>
        <span class="status-pill">${st==='completed'?'✓ Completed':st==='in-progress'?'◐ In progress':'○ Not started'}</span>
      </div>
      <div class="controls-row">
        <button class="ctl ${st==='in-progress'?'on':''}" id="btnProgress">◐ Mark in progress</button>
        <button class="ctl ${st==='completed'?'on':''}" id="btnComplete">✓ Mark completed</button>
        <button class="ctl ${cs().bookmarks.includes(currentVideoId)?'on':''}" id="btnBookmark">${cs().bookmarks.includes(currentVideoId)?'★ Bookmarked':'☆ Bookmark'}</button>
        <button class="ctl" id="btnFullscreen">⛶ Fullscreen</button>
        <div class="speed-group" id="speedGroup">
          ${[0.75,1,1.25,1.5,2].map(s=>`<button data-speed="${s}" class="${s===1?'on':''}">${s}×</button>`).join("")}
        </div>
      </div>
    </div>`;
  initPlayer(currentVideoId);
  document.getElementById("btnProgress").onclick = () => setProgress(currentVideoId,"in-progress",true);
  document.getElementById("btnComplete").onclick = () => setProgress(currentVideoId,"completed",true);
  document.getElementById("btnBookmark").onclick = () => toggleBookmark(currentVideoId);
  document.getElementById("btnFullscreen").onclick = () => { const el=document.getElementById("playerWrap"); if(el.requestFullscreen) el.requestFullscreen(); };
  document.getElementById("speedGroup").onclick = (e) => {
    const btn = e.target.closest("button[data-speed]"); if(!btn) return;
    if(player && player.setPlaybackRate) player.setPlaybackRate(parseFloat(btn.dataset.speed));
    document.querySelectorAll("#speedGroup button").forEach(b=>b.classList.toggle("on", b===btn));
  };
}

/* ---------- YouTube IFrame API ---------- */
function loadYTApi(){ if(window.YT && window.YT.Player) return; const t=document.createElement('script'); t.src="https://www.youtube.com/iframe_api"; document.head.appendChild(t); }
window.onYouTubeIframeAPIReady = function(){ if(currentVideoId) initPlayer(currentVideoId); };
function initPlayer(videoId){
  if(!window.YT || !window.YT.Player){ loadYTApi(); return; }
  if(player) player.destroy();
  player = new YT.Player('ytFrame', {
    videoId,
    playerVars:{ rel:0, modestbranding:1, playsinline:1, fs:1, controls:1, autoplay:0, iv_load_policy:3, cc_load_policy:0 },
    events:{
      onStateChange:(e)=>{
        if(e.data===YT.PlayerState.PLAYING){
          if(cs().progress[videoId]!=="completed") setProgress(videoId,"in-progress",false);
          pushRecent(videoId);
        }
        if(e.data===YT.PlayerState.ENDED) setProgress(videoId,"completed",true);
      }
    }
  });
}

/* ---------- State mutations ---------- */
function setProgress(id, status, rerender){
  if(cs().progress[id]===status) delete cs().progress[id]; else cs().progress[id]=status;
  saveState(state); if(rerender) renderMain(); renderAll();
}
function toggleBookmark(id){
  const b = cs().bookmarks; const i = b.indexOf(id);
  if(i>-1) b.splice(i,1); else b.unshift(id);
  saveState(state); renderAll(); renderMain();
}
function pushRecent(id){
  cs().recent = [id, ...cs().recent.filter(x=>x!==id)].slice(0,20);
  saveState(state); renderAll();
}
function playVideo(id){
  if(!findVideo(id)) return; // guard: only ever plays videos from the loaded/validated list
  currentVideoId = id;
  renderAll();
  if(window.innerWidth<=860) document.getElementById("sidebar").classList.add("hidden-mobile");
}

document.addEventListener("click",(e)=>{
  const bm = e.target.closest("[data-bm]"); if(bm){ e.stopPropagation(); toggleBookmark(bm.dataset.bm); return; }
  const p = e.target.closest("[data-play]"); if(p){ playVideo(p.dataset.play); return; }
});

document.getElementById("themeToggle").addEventListener("click", () => {
  const isPaper = document.body.dataset.theme === "paper";
  document.body.dataset.theme = isPaper ? "chalk" : "paper";
  state.theme = document.body.dataset.theme; saveState(state);
});
document.getElementById("mobileBack").addEventListener("click", () => document.getElementById("sidebar").classList.remove("hidden-mobile"));
document.getElementById("sidebarToggle").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("hidden-mobile"));

document.addEventListener("keydown",(e)=>{
  if(e.target.tagName==="INPUT"){ if(e.key==="Escape") e.target.blur(); return; }
  if(!currentChannel) return;
  if(e.key==="/"){ e.preventDefault(); document.getElementById("searchBox2").focus(); }
  if(e.key==="f") document.getElementById("btnFullscreen")?.click();
  if(e.key===" " && player){ e.preventDefault(); const s=player.getPlayerState(); (s===1)?player.pauseVideo():player.playVideo(); }
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    const i = videos.findIndex(v=>v.id===currentVideoId); if(i===-1) return;
    const next = e.key==="ArrowDown" ? videos[i+1] : videos[i-1];
    if(next) playVideo(next.id);
  }
});

/* ---------- Init ---------- */
document.body.dataset.theme = state.theme || "chalk";
loadYTApi();
renderRecentChips();
if(window.innerWidth<=860) document.getElementById("sidebarToggle").style.display="flex";
</script>
