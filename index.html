<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Channel Focus</title>
<style>
  :root{
    --bg:#f4efe2; --paper:#fffdf6; --surface-2:#ece4d1; --ink:#2a271f; --ink-dim:#6d6653; --line:#d8cdb1;
    --ok:#3f7a55; --warn:#b8860b; --bm:#b3402b; --accent:#3f7a55; --radius:8px; --radius-sm:5px;
    --shadow:0 2px 10px rgba(20,15,5,.08); --line-soft:var(--line);
    --serif:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  [data-theme="dark"]{
    --bg:#182722; --paper:#1f342c; --surface-2:#243c33; --ink:#eef2ea; --ink-dim:#a9bcb2; --line:#31504363;
    --ok:#7fd1ae; --warn:#e8c468; --bm:#e0836f; --accent:#7fd1ae; --shadow:0 2px 10px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);position:relative;}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;z-index:0;
    background-image:linear-gradient(var(--ink) 1px,transparent 1px),linear-gradient(90deg,var(--ink) 1px,transparent 1px);
    background-size:34px 34px;
  }
  #pickerScreen,#browseScreen,#playerScreen,.theme-fab,.brand-fab{position:relative;z-index:1;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  /* Soft bordered button, paper aesthetic */
  .btn{background:var(--paper);border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:var(--radius-sm);font-size:.8rem;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.on{border-color:var(--accent);color:var(--accent);background:var(--surface-2);}
  .field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink);font-size:.86rem;}
  .field:focus{outline:none;box-shadow:0 0 0 1px var(--accent);border-color:var(--accent);}

  /* Fixed Theme button, top-right, shown once a channel is picked */
  .theme-fab{position:fixed;top:14px;right:16px;z-index:20;background:var(--paper);box-shadow:var(--shadow);}
  .brand-fab{position:fixed;top:16px;left:18px;z-index:20;font-family:var(--serif);font-size:1.05rem;color:var(--ink);}
  .brand-fab em{font-style:normal;color:var(--accent);}

  /* ---------- Picker screen ---------- */
  .picker{max-width:600px;margin:9vh auto 0;padding:0 20px;}
  .picker h1{font-family:var(--serif);font-weight:400;font-size:1.9rem;text-align:center;margin-bottom:8px;}
  .picker p{color:var(--ink-dim);text-align:center;font-size:.85rem;margin-bottom:26px;line-height:1.6;}
  .picker-search input{padding:14px 16px;font-size:.95rem;}
  .picker-hint{font-size:.72rem;color:var(--ink-dim);margin-top:8px;padding-left:2px;}
  .channel-results{margin-top:2px;border:1px solid var(--line);border-top:none;}
  .channel-result{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line-soft);}
  .channel-result:hover{background:var(--line-soft);}
  .channel-result img{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--line-soft);}
  .channel-result .ct{flex:1;min-width:0;}
  .channel-result .ct .t{font-size:.88rem;font-weight:600;}
  .channel-result .ct .d{font-size:.74rem;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .recent-section{margin-top:36px;}
  .recent-section .label{font-size:.8rem;font-weight:600;margin-bottom:10px;}
  .recent-list{border-top:1px solid var(--line-soft);}
  .recent-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-soft);cursor:pointer;}
  .recent-row:hover .n{text-decoration:underline;}
  .recent-row img{width:28px;height:28px;border-radius:50%;background:var(--line-soft);}
  .recent-row .n{font-size:.86rem;}
  .recent-row .arrow{margin-left:auto;color:var(--ink-dim);font-size:.85rem;}

  /* ---------- Browse screen ---------- */
  .browse{max-width:1180px;margin:0 auto;padding:54px 20px 60px;}
  .browse-header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .browse-header .search-bar{flex:1;min-width:200px;max-width:520px;}
  .channel-badge{display:flex;align-items:center;gap:8px;}
  .channel-badge img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--line-soft);}
  .channel-badge .n{font-size:.84rem;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .channel-badge button{font-size:.68rem;padding:5px 9px;}

  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .playlist-heading{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .playlist-heading h2{font-size:1.05rem;font-weight:600;margin:0;}
  .playlist-heading button{font-size:.7rem;padding:5px 10px;}
  .progress-strip{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:.76rem;color:var(--ink-dim);}
  .progress-strip .bar{flex:1;max-width:200px;height:4px;background:var(--line-soft);}
  .progress-strip .bar>div{height:100%;background:var(--ink);}

  .video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px 18px;}
  .vcard{cursor:pointer;}
  .vcard .thumb{position:relative;width:100%;aspect-ratio:16/9;background:var(--line-soft);overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);}
  .vcard .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .vcard .thumb .dur{position:absolute;right:5px;bottom:5px;background:#000;color:#fff;font-size:.64rem;padding:2px 5px;border-radius:2px;}
  .vcard .thumb .status-dot{position:absolute;left:5px;top:5px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-size:.62rem;padding:1px 5px;border-radius:2px;}
  .vcard .thumb .status-dot.done{color:var(--ok);border-color:var(--ok);}
  .vcard .thumb .status-dot.progress{color:var(--warn);border-color:var(--warn);}
  .vcard .t{font-size:.83rem;margin-top:8px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .vcard .meta{display:flex;align-items:center;margin-top:4px;}
  .vcard .bm{margin-left:auto;font-size:.85rem;opacity:.4;}
  .vcard .bm.on{opacity:1;color:var(--bm);}
  .empty-note{font-size:.84rem;color:var(--ink-dim);padding:20px 4px;line-height:1.6;}

  /* ---------- Player screen ---------- */
  .player-outer{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
  @media (max-width:860px){ .player-outer{grid-template-columns:1fr;} .player-sidebar{display:none;} .player-sidebar.show-mobile{display:block;} }
  .player-sidebar{border-right:1px solid var(--line);padding:54px 14px 16px;}
  .player-sidebar .channel-badge{margin-bottom:14px;}
  .player-sidebar .search-bar{margin-bottom:16px;}
  .sidebar-panel-head{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;margin-bottom:10px;}
  .sidebar-panel-head button{margin-left:auto;background:none;border:1px solid var(--line);border-radius:var(--radius);width:22px;height:22px;font-size:.75rem;padding:0;}
  .recent-thumb-row{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;}
  .recent-thumb-row img{width:64px;height:36px;object-fit:cover;border:1px solid var(--line);border-radius:var(--radius);flex-shrink:0;}
  .recent-thumb-row .t{font-size:.74rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  #notesArea{width:100%;height:60vh;border:1px solid var(--line);border-radius:var(--radius);padding:10px;font-size:.82rem;line-height:1.9;
    background-image:repeating-linear-gradient(var(--bg) 0 27px, var(--line-soft) 27px 28px);resize:none;}
  #notesArea:focus{outline:none;}
  .notes-saved{font-size:.68rem;color:var(--ink-dim);margin-top:6px;}

  .player-main{padding:54px 22px 60px;max-width:900px;}
  .mobile-sidebar-toggle{display:none;}
  @media (max-width:860px){ .mobile-sidebar-toggle{display:inline-flex;margin-bottom:12px;} }
  .back-link{background:none;border:none;color:var(--ink-dim);font-size:.82rem;margin-bottom:14px;padding:0;cursor:pointer;}
  .back-link:hover{color:var(--ink);text-decoration:underline;}
  .player-frame-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  #ytFrame{width:100%;height:100%;border:0;}
  .video-title{font-size:1.15rem;font-weight:600;margin:14px 0 0;line-height:1.4;}
  .controls-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .controls-row-2{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px;}
  .controls-row-3{display:flex;justify-content:flex-end;margin-top:8px;}
  .controls-row-2 .spacer{margin-left:auto;}
  .description-panel{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);padding:14px;font-size:.82rem;line-height:1.7;color:var(--ink-dim);white-space:pre-wrap;max-height:280px;overflow-y:auto;}
  .speed-group{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .speed-group button{background:var(--bg);border:none;border-right:1px solid var(--line);color:var(--ink-dim);padding:9px 10px;font-size:.74rem;}
  .speed-group button:last-child{border-right:none;}
  .speed-group button.on{background:var(--ink);color:var(--bg);}

  .home-hero{max-width:480px;margin:10vh auto 0;text-align:center;padding:0 16px;}
  .home-hero img{width:56px;height:56px;border-radius:50%;margin-bottom:14px;}
  .home-hero h2{font-size:1.2rem;font-weight:600;margin-bottom:8px;}
  .home-hero p{color:var(--ink-dim);font-size:.84rem;line-height:1.6;}
  kbd{border:1px solid var(--line-soft);border-radius:2px;padding:1px 6px;font-size:.7rem;}
  .kb-hint{margin-top:24px;font-size:.7rem;color:var(--ink-dim);display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
</style>
</head>
<body data-theme="light">

<div class="brand-fab">CHANNEL <em>FOCUS</em></div>
<button class="btn theme-fab" id="themeToggle" style="display:none">🌓 Theme</button>

<div id="pickerScreen" class="picker">
  <h1>Watch one channel. Nothing else.</h1>
  <p>Type any YouTube channel's name — you'll only ever see videos from that one channel. No Shorts, no Home feed, no recommendations.</p>
  <div class="picker-search">
    <input class="field" id="channelSearchInput" placeholder="Search a YouTube channel…" autocomplete="off">
  </div>
  <div id="channelResults" class="channel-results" style="display:none"></div>
  <div id="recentSection" class="recent-section" style="display:none">
    <div class="label">Recently viewed</div>
    <div id="recentList" class="recent-list"></div>
  </div>
</div>

<div id="browseScreen" class="browse" style="display:none">
  <div class="browse-header">
    <div class="search-bar"><input class="field" id="searchBox2" placeholder="Search videos in this channel…"></div>
    <div class="channel-badge">
      <img id="channelAvatar" src="" alt="" onerror="this.onerror=null;this.src=initialsAvatarSvg(currentChannel&&currentChannel.channelTitle);">
      <span class="n" id="channelName"></span>
      <button class="btn" id="changeChannelBtn">Switch</button>
    </div>
  </div>

  <div id="playlistHeading" class="playlist-heading" style="display:none">
    <h2 id="playlistHeadingName"></h2>
    <button class="btn" id="resetToUploads">Show all uploads</button>
  </div>

  <div class="filter-row" id="filterRow">
    <button class="btn" data-tab="completed">Completed</button>
    <button class="btn" data-tab="bookmarks">Bookmarked</button>
    <button class="btn" data-tab="progress">Marked as progress</button>
    <button class="btn" id="playlistFilterBtn" data-tab="playlists">Playlist</button>
  </div>

  <div class="progress-strip"><span id="overallPct">0%</span> watched
    <div class="bar"><div id="overallBar" style="width:0%"></div></div>
  </div>

  <div id="gridArea"></div>
</div>

<div id="playerScreen" style="display:none">
  <div class="player-outer">
    <aside class="player-sidebar" id="playerSidebar">
      <div class="channel-badge">
        <img id="channelAvatarSm" src="" alt="" onerror="this.onerror=null;this.src=initialsAvatarSvg(currentChannel&&currentChannel.channelTitle);">
        <span class="n" id="channelNameSm"></span>
      </div>
      <div class="search-bar"><input class="field" id="searchBoxPlayer" placeholder="Search bar"></div>
      <div class="sidebar-panel-head">
        <span id="sidebarPanelTitle">Recently watched</span>
        <button id="notesCloseBtn" style="display:none">✕</button>
      </div>
      <div id="sidebarPanelBody"></div>
    </aside>
    <main class="player-main">
      <button class="btn mobile-sidebar-toggle" id="mobileSidebarToggle">☰ Recently watched / Notes</button>
      <button class="back-link" id="backLink">← Back to videos</button>
      <div class="player-frame-wrap" id="playerWrap"><div id="ytFrame"></div></div>
      <div class="video-title" id="videoTitleEl"></div>
      <div class="controls-row">
        <button class="btn" id="btnBookmark">Bookmark</button>
        <button class="btn" id="btnComplete">Mark as completed</button>
        <button class="btn" id="btnProgress">Marked as progress</button>
        <button class="btn" id="btnNotes">Notes</button>
        <button class="btn" id="btnDescription">Description</button>
        <button class="btn" id="btnFullscreen" style="margin-left:auto">Full screen</button>
      </div>
      <div class="controls-row-2">
        <div class="speed-group" id="speedGroup"></div>
      </div>
      <div id="descriptionPanel" class="description-panel" style="display:none"></div>
    </main>
  </div>
</div>

<script>
const LS_KEY = "channelFocus_v3";
function loadState(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function saveState(s){ localStorage.setItem(LS_KEY, JSON.stringify(s)); }
let state = Object.assign({ theme:"light", recentChannels:[], perChannel:{} }, loadState());
state.recentChannels = (state.recentChannels||[]).filter(c => c && c.channelId && c.channelTitle);
saveState(state);

// best-effort migration from earlier versions of this app
for(const oldKey of ["channelFocus_v2","channelFocus_v1"]){
  try{
    const old = JSON.parse(localStorage.getItem(oldKey)||"null");
    if(old && !localStorage.getItem(LS_KEY+"_migrated_"+oldKey)){
      state.recentChannels = (state.recentChannels && state.recentChannels.length) ? state.recentChannels : (old.recentChannels||[]);
      state.perChannel = Object.assign({}, old.perChannel, state.perChannel);
      localStorage.setItem(LS_KEY+"_migrated_"+oldKey,"1");
      saveState(state);
    }
  }catch(e){}
}
state.recentChannels = (state.recentChannels||[]).filter(c => c && c.channelId && c.channelTitle);
saveState(state);

function channelState(channelId){
  if(!state.perChannel[channelId]) state.perChannel[channelId] = { progress:{}, bookmarks:[], recent:[], notes:{} };
  if(!state.perChannel[channelId].notes) state.perChannel[channelId].notes = {};
  return state.perChannel[channelId];
}
function cs(){ return channelState(currentChannel.channelId); }
function escapeAttr(s){ return (s||"").replace(/"/g,'&quot;'); }
function initialsAvatarSvg(name){
  const letter = (name||"?").trim().charAt(0).toUpperCase() || "?";
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='40' height='40' rx='20' fill='%233f7a55'/><text x='20' y='26' font-family='sans-serif' font-size='18' fill='white' text-anchor='middle'>${letter}</text></svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg);
}
function avatarImgTag(thumb, name, extraAttrs){
  const fallback = initialsAvatarSvg(name);
  return `<img src="${thumb || fallback}" alt="" ${extraAttrs||""} onerror="this.onerror=null;this.src='${fallback}';">`;
}
function formatDuration(sec){
  if(!sec) return "";
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.floor(sec%60);
  const mm = h ? String(m).padStart(2,'0') : m;
  return (h?h+":":"") + mm + ":" + String(s).padStart(2,'0');
}

let currentChannel = null;
let videos = [];
let currentVideoId = null;
let currentPlaylist = null;
let channelPlaylists = null;
let activeFilter = null; // null = all, else 'completed'|'bookmarks'|'progress'|'playlists'
let player = null;
let sidebarMode = "recent"; // 'recent' | 'notes'

/* ---------- Channel search ---------- */
const channelSearchInput = document.getElementById("channelSearchInput");
let searchDebounce;
channelSearchInput.addEventListener("input", (e) => {
  clearTimeout(searchDebounce);
  const q = e.target.value.trim();
  if(!q){ document.getElementById("channelResults").style.display = "none"; return; }
  searchDebounce = setTimeout(() => doChannelSearch(q), 350);
});
async function doChannelSearch(q){
  const box = document.getElementById("channelResults");
  box.style.display = "block";
  box.innerHTML = `<div class="empty-note">Searching…</div>`;
  try{
    const r = await fetch(`/api/search-channels?q=${encodeURIComponent(q)}`);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    if(!data.channels.length){ box.innerHTML = `<div class="empty-note">No channels found.</div>`; return; }
    box.innerHTML = data.channels.map(c => `
      <div class="channel-result" data-select="${c.channelId}" data-title="${escapeAttr(c.title)}" data-thumb="${escapeAttr(c.thumbnail)}">
        ${avatarImgTag(c.thumbnail, c.title)}
        <div class="ct"><div class="t">${c.title}</div><div class="d">${c.description||''}</div></div>
        <button class="btn">Select</button>
      </div>`).join("");
  }catch(e){
    box.innerHTML = `<div class="empty-note">Search failed: ${e.message}</div>`;
  }
}
document.getElementById("channelResults").addEventListener("click",(e)=>{
  const el = e.target.closest("[data-select]"); if(!el) return;
  selectChannel(el.dataset.select, el.dataset.title, el.dataset.thumb);
});

function renderRecentSection(){
  const sec = document.getElementById("recentSection");
  const list = document.getElementById("recentList");
  if(!state.recentChannels.length){ sec.style.display = "none"; return; }
  sec.style.display = "block";
  list.innerHTML = state.recentChannels.map(c => `
    <div class="recent-row" data-select="${c.channelId}" data-title="${escapeAttr(c.channelTitle)}" data-thumb="${escapeAttr(c.channelThumbnail)}">
      ${avatarImgTag(c.channelThumbnail, c.channelTitle)}<span class="n">${c.channelTitle}</span><span class="arrow">→</span>
    </div>`).join("");
}
document.getElementById("recentList").addEventListener("click",(e)=>{
  const el = e.target.closest("[data-select]"); if(!el) return;
  selectChannel(el.dataset.select, el.dataset.title, el.dataset.thumb);
});

/* ---------- Select channel / load videos ---------- */
async function selectChannel(channelId, title, thumbnail){
  currentChannel = { channelId, channelTitle: title, channelThumbnail: thumbnail };
  state.recentChannels = [currentChannel, ...state.recentChannels.filter(c=>c.channelId!==channelId)].slice(0,8);
  saveState(state);

  document.getElementById("pickerScreen").style.display = "none";
  document.getElementById("browseScreen").style.display = "block";
  document.getElementById("themeToggle").style.display = "inline-flex";
  document.getElementById("channelAvatar").src = thumbnail;
  document.getElementById("channelName").textContent = title;
  document.getElementById("channelAvatarSm").src = thumbnail;
  document.getElementById("channelNameSm").textContent = title;

  currentPlaylist = null; channelPlaylists = null; activeFilter = null;
  document.getElementById("playlistHeading").style.display = "none";
  setFilterActive(null);
  await loadVideoSource(null, null);
}

async function loadVideoSource(playlistId, playlistTitle){
  currentPlaylist = playlistId ? { playlistId, title: playlistTitle } : null;
  document.getElementById("playlistHeading").style.display = playlistId ? "flex" : "none";
  document.getElementById("playlistHeadingName").textContent = playlistTitle || "";
  document.getElementById("playlistFilterBtn").style.display = playlistId ? "none" : "inline-flex";

  const channelId = currentChannel.channelId;
  const cacheKey = "channelFocus_videos_" + channelId + (playlistId ? "_pl_" + playlistId : "");

  try{
    const cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
    if(cached && Date.now() - cached.at < 6*60*60*1000){ videos = cached.videos; activeFilter=null; setFilterActive(null); renderGrid(); return; }
  }catch(e){}

  videos = [];
  document.getElementById("gridArea").innerHTML = `<div class="empty-note">Loading videos…</div>`;
  try{
    const url = `/api/channel-videos?channelId=${encodeURIComponent(channelId)}` + (playlistId ? `&playlistId=${encodeURIComponent(playlistId)}` : "");
    const r = await fetch(url);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    videos = data.videos;
    localStorage.setItem(cacheKey, JSON.stringify({ videos, at: Date.now() }));
  }catch(e){
    document.getElementById("gridArea").innerHTML = `<div class="empty-note">Couldn't load videos (${e.message}).</div>`;
    return;
  }
  activeFilter = null; setFilterActive(null);
  renderGrid();
}
document.getElementById("resetToUploads").addEventListener("click", () => loadVideoSource(null, null));

document.getElementById("changeChannelBtn").addEventListener("click", () => {
  currentChannel=null; videos=[]; currentVideoId=null; currentPlaylist=null; channelPlaylists=null;
  if(player){ player.stopVideo && player.stopVideo(); }
  document.getElementById("browseScreen").style.display="none";
  document.getElementById("playerScreen").style.display="none";
  document.getElementById("themeToggle").style.display="none";
  document.getElementById("pickerScreen").style.display="block";
  renderRecentSection();
});

/* ---------- Filters (toggle: click active again to clear) + grid ---------- */
function setFilterActive(tab){
  activeFilter = tab;
  document.querySelectorAll("#filterRow button[data-tab]").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
}
document.getElementById("filterRow").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-tab]"); if(!btn) return;
  const tab = btn.dataset.tab;
  if(tab === "playlists"){ renderPlaylistGrid(); setFilterActive("playlists"); return; }
  setFilterActive(activeFilter===tab ? null : tab);
  renderGrid();
});
document.getElementById("searchBox2").addEventListener("input", () => {
  if(activeFilter === "playlists") setFilterActive(null);
  renderGrid();
});

function findVideo(id){ return videos.find(v=>v.id===id); }
function listForFilter(){
  const q = (document.getElementById("searchBox2").value||"").trim().toLowerCase();
  let list;
  if(activeFilter==="completed") list = videos.filter(v=>cs().progress[v.id]==="completed");
  else if(activeFilter==="bookmarks") list = cs().bookmarks.map(findVideo).filter(Boolean);
  else if(activeFilter==="progress") list = videos.filter(v=>cs().progress[v.id]==="in-progress");
  else list = videos;
  if(q) list = list.filter(v=>v.title.toLowerCase().includes(q));
  return list;
}

function renderGrid(){
  if(!currentChannel) return;
  const box = document.getElementById("gridArea");
  const list = listForFilter();
  if(!list.length){ box.innerHTML = `<div class="empty-note">Nothing here yet.</div>`; }
  else{
    box.innerHTML = `<div class="video-grid">` + list.map(v => {
      const st = cs().progress[v.id];
      const bmOn = cs().bookmarks.includes(v.id);
      return `
      <div class="vcard" data-play="${v.id}">
        <div class="thumb">
          <img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" loading="lazy" alt=""
               onerror="this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'">
          ${st==="completed" ? '<span class="status-dot done">Done</span>' : st==="in-progress" ? '<span class="status-dot progress">In progress</span>' : ''}
          ${v.durationSeconds ? `<span class="dur">${formatDuration(v.durationSeconds)}</span>` : ''}
        </div>
        <div class="t">${v.title}</div>
        <div class="meta"><span class="bm ${bmOn?'on':''}" data-bm="${v.id}">${bmOn?'★':'☆'}</span></div>
      </div>`;
    }).join("") + `</div>`;
  }
  const done = videos.filter(v=>cs().progress[v.id]==="completed").length;
  const pct = videos.length ? Math.round(done/videos.length*100) : 0;
  document.getElementById("overallPct").textContent = pct+"%";
  document.getElementById("overallBar").style.width = pct+"%";
}
document.getElementById("gridArea").addEventListener("click",(e)=>{
  const bm = e.target.closest("[data-bm]"); if(bm){ e.stopPropagation(); toggleBookmark(bm.dataset.bm); return; }
  const card = e.target.closest("[data-play]"); if(card){ playVideo(card.dataset.play); return; }
  const pl = e.target.closest("[data-playlist]"); if(pl){
    const playlistId = pl.dataset.playlist || null;
    loadVideoSource(playlistId, playlistId ? pl.dataset.title : null);
    return;
  }
});

/* ---------- Playlists ---------- */
async function renderPlaylistGrid(){
  const box = document.getElementById("gridArea");
  if(channelPlaylists){ drawPlaylistGrid(); return; }
  box.innerHTML = `<div class="empty-note">Loading playlists…</div>`;
  try{
    const r = await fetch(`/api/channel-playlists?channelId=${encodeURIComponent(currentChannel.channelId)}`);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    channelPlaylists = data.playlists;
    drawPlaylistGrid();
  }catch(e){
    box.innerHTML = `<div class="empty-note">Couldn't load playlists (${e.message}).</div>`;
  }
}
function drawPlaylistGrid(){
  const box = document.getElementById("gridArea");
  if(!channelPlaylists.length){ box.innerHTML = `<div class="empty-note">This channel has no public playlists.</div>`; return; }
  box.innerHTML = `<div class="video-grid">` + channelPlaylists.map(p => `
    <div class="vcard" data-playlist="${p.playlistId}" data-title="${escapeAttr(p.title)}">
      <div class="thumb"><img src="${p.thumbnail}" loading="lazy" alt=""></div>
      <div class="t">${p.title}</div>
      <div class="meta" style="color:var(--ink-dim);font-size:.72rem">${p.itemCount} videos</div>
    </div>`).join("") + `</div>`;
}

/* ---------- Player screen ---------- */
function playVideo(id){
  if(!findVideo(id)) return;
  currentVideoId = id;
  pushRecent(id);
  document.getElementById("browseScreen").style.display = "none";
  document.getElementById("playerScreen").style.display = "block";
  sidebarMode = "recent";
  renderPlayer();
}
document.getElementById("backLink").addEventListener("click", () => {
  if(player){ player.pauseVideo && player.pauseVideo(); }
  document.getElementById("playerScreen").style.display = "none";
  document.getElementById("browseScreen").style.display = "block";
  renderGrid();
});
document.getElementById("mobileSidebarToggle").addEventListener("click", () => {
  document.getElementById("playerSidebar").classList.toggle("show-mobile");
});
document.getElementById("searchBoxPlayer").addEventListener("keydown", (e) => {
  if(e.key !== "Enter") return;
  const q = e.target.value;
  document.getElementById("backLink").click();
  document.getElementById("searchBox2").value = q;
  renderGrid();
});

function renderSidebarPanel(){
  document.getElementById("sidebarPanelTitle").textContent = sidebarMode === "notes" ? "Notes" : "Recently watched";
  document.getElementById("notesCloseBtn").style.display = sidebarMode === "notes" ? "inline-block" : "none";
  const body = document.getElementById("sidebarPanelBody");
  if(sidebarMode === "notes"){
    body.innerHTML = `<textarea id="notesArea" placeholder="Write anything about this video — key points, doubts, questions to revisit…">${cs().notes[currentVideoId]||""}</textarea><div class="notes-saved" id="notesSaved">&nbsp;</div>`;
    const ta = document.getElementById("notesArea");
    let saveTimer;
    ta.addEventListener("input", () => {
      clearTimeout(saveTimer);
      document.getElementById("notesSaved").textContent = "Saving…";
      saveTimer = setTimeout(() => {
        cs().notes[currentVideoId] = ta.value; saveState(state);
        document.getElementById("notesSaved").textContent = "Saved";
      }, 500);
    });
  } else {
    const recentVids = cs().recent.map(findVideo).filter(Boolean).slice(0,12);
    body.innerHTML = recentVids.length ? recentVids.map(v => `
      <div class="recent-thumb-row" data-goto="${v.id}">
        <img src="https://i.ytimg.com/vi/${v.id}/default.jpg" alt="">
        <div class="t">${v.title}</div>
      </div>`).join("") : `<div class="empty-note">Nothing watched yet.</div>`;
  }
}
document.getElementById("sidebarPanelBody").addEventListener("click",(e)=>{
  const el = e.target.closest("[data-goto]"); if(!el) return;
  playVideo(el.dataset.goto);
});
document.getElementById("notesCloseBtn").addEventListener("click", () => { sidebarMode = "recent"; renderSidebarPanel(); });

function renderPlayer(){
  const v = findVideo(currentVideoId);
  document.getElementById("videoTitleEl").textContent = v.title;
  const st = cs().progress[currentVideoId];
  document.getElementById("btnBookmark").classList.toggle("on", cs().bookmarks.includes(currentVideoId));
  document.getElementById("btnBookmark").textContent = cs().bookmarks.includes(currentVideoId) ? "★ Bookmarked" : "Bookmark";
  document.getElementById("btnComplete").classList.toggle("on", st==="completed");
  document.getElementById("btnProgress").classList.toggle("on", st==="in-progress");
  document.getElementById("btnNotes").classList.toggle("on", sidebarMode==="notes");
  const descPanel = document.getElementById("descriptionPanel");
  descPanel.style.display = "none";
  descPanel.textContent = v.description || "No description provided for this video.";
  document.getElementById("btnDescription").classList.remove("on");
  renderSidebarPanel();
  initPlayer(currentVideoId);
}
document.getElementById("btnBookmark").addEventListener("click", () => toggleBookmark(currentVideoId));
document.getElementById("btnComplete").addEventListener("click", () => {
  const cur = cs().progress[currentVideoId];
  setProgress(currentVideoId, cur==="completed" ? null : "completed");
});
document.getElementById("btnProgress").addEventListener("click", () => {
  const cur = cs().progress[currentVideoId];
  setProgress(currentVideoId, cur==="in-progress" ? null : "in-progress");
});
document.getElementById("btnNotes").addEventListener("click", () => {
  sidebarMode = sidebarMode === "notes" ? "recent" : "notes";
  document.getElementById("btnNotes").classList.toggle("on", sidebarMode==="notes");
  renderSidebarPanel();
  document.getElementById("playerSidebar").classList.add("show-mobile");
});
document.getElementById("btnDescription").addEventListener("click", () => {
  const panel = document.getElementById("descriptionPanel");
  const showing = panel.style.display !== "none";
  panel.style.display = showing ? "none" : "block";
  document.getElementById("btnDescription").classList.toggle("on", !showing);
});
document.getElementById("btnFullscreen").addEventListener("click", () => {
  const el = document.getElementById("playerWrap"); if(el.requestFullscreen) el.requestFullscreen();
});
document.getElementById("speedGroup").innerHTML = [1,1.25,1.5,2].map(s=>`<button data-speed="${s}" class="${s===1?'on':''}">${s}×</button>`).join("");
document.getElementById("speedGroup").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-speed]"); if(!btn) return;
  if(player && player.setPlaybackRate) player.setPlaybackRate(parseFloat(btn.dataset.speed));
  document.querySelectorAll("#speedGroup button").forEach(b=>b.classList.toggle("on", b===btn));
});

/* ---------- YouTube IFrame API ---------- */
function loadYTApi(){ if(window.YT && window.YT.Player) return; const t=document.createElement('script'); t.src="https://www.youtube.com/iframe_api"; document.head.appendChild(t); }
window.onYouTubeIframeAPIReady = function(){ if(currentVideoId) initPlayer(currentVideoId); };
function initPlayer(videoId){
  if(!window.YT || !window.YT.Player){ loadYTApi(); return; }
  if(player) player.destroy();
  player = new YT.Player('ytFrame', {
    videoId,
    playerVars:{ rel:0, modestbranding:1, playsinline:1, fs:1, controls:1, autoplay:0, iv_load_policy:3, cc_load_policy:0 },
    events:{
      onStateChange:(e)=>{
        if(e.data===YT.PlayerState.PLAYING && cs().progress[videoId]!=="completed") setProgress(videoId,"in-progress");
        if(e.data===YT.PlayerState.ENDED) setProgress(videoId,"completed");
      }
    }
  });
}

/* ---------- State mutations ---------- */
function setProgress(id, status){
  if(!status) delete cs().progress[id]; else cs().progress[id] = status;
  saveState(state);
  if(document.getElementById("playerScreen").style.display !== "none" && id === currentVideoId){
    document.getElementById("btnComplete").classList.toggle("on", cs().progress[id]==="completed");
    document.getElementById("btnProgress").classList.toggle("on", cs().progress[id]==="in-progress");
  }
}
function toggleBookmark(id){
  const b = cs().bookmarks; const i = b.indexOf(id);
  if(i>-1) b.splice(i,1); else b.unshift(id);
  saveState(state);
  if(document.getElementById("playerScreen").style.display !== "none" && id === currentVideoId){
    document.getElementById("btnBookmark").classList.toggle("on", cs().bookmarks.includes(id));
    document.getElementById("btnBookmark").textContent = cs().bookmarks.includes(id) ? "★ Bookmarked" : "Bookmark";
  }
  if(document.getElementById("browseScreen").style.display !== "none") renderGrid();
}
function pushRecent(id){
  cs().recent = [id, ...cs().recent.filter(x=>x!==id)].slice(0,30);
  saveState(state);
}

/* ---------- Theme ---------- */
document.getElementById("themeToggle").addEventListener("click", () => {
  const isDark = document.body.dataset.theme === "dark";
  document.body.dataset.theme = isDark ? "light" : "dark";
  state.theme = document.body.dataset.theme; saveState(state);
});

/* ---------- Keyboard shortcuts ---------- */
document.addEventListener("keydown",(e)=>{
  if(e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA"){ if(e.key==="Escape") e.target.blur(); return; }
  if(!currentChannel) return;
  if(e.key==="/"){ e.preventDefault(); document.getElementById("searchBox2")?.focus(); }
  if(e.key==="f") document.getElementById("btnFullscreen")?.click();
  if(e.key===" " && player){ e.preventDefault(); const s=player.getPlayerState(); (s===1)?player.pauseVideo():player.playVideo(); }
  if((e.key==="ArrowDown"||e.key==="ArrowUp") && currentVideoId){
    const i = videos.findIndex(v=>v.id===currentVideoId); if(i===-1) return;
    const next = e.key==="ArrowDown" ? videos[i+1] : videos[i-1];
    if(next) playVideo(next.id);
  }
});

/* ---------- Init ---------- */
document.body.dataset.theme = state.theme || "light";
loadYTApi();
renderRecentSection();
</script>
